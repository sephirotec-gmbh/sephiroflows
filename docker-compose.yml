version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sephiroflows-postgres
    environment:
      POSTGRES_DB: sephiroflows
      POSTGRES_USER: sephiro
      POSTGRES_PASSWORD: sephiro_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sephiro -d sephiroflows"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sephiroflows-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data: